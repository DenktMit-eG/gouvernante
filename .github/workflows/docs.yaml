name: Docs

on:
  push:
    branches: [main]
    paths:
      - docs/**
      - mkdocs.yml
      - rules/**
  pull_request:
    branches: [main]
    paths:
      - docs/**
      - mkdocs.yml
      - rules/**

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  docs:
    name: Build & Deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build docs
        run: |
          docker compose -f docker-compose.docs.yml run --rm mkdocs build --strict
          sudo chown -R $(id -u):$(id -g) site/

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.9"
          cache: false

      - name: Validate incident rules
        run: |
          mkdir -p /tmp/empty
          go run -mod=vendor ./cmd/gouvernante -rules ./rules/incidents -dir /tmp/empty

      - name: Build rules.zip
        run: |
          find rules/incidents -name '*.json' -exec touch -d '2024-01-01T00:00:00Z' {} +
          mkdir -p site/rules
          cd rules/incidents
          TZ=UTC zip -X -j ../../site/rules/rules.zip $(ls *.json | sort)

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/

      - name: Deploy to GitHub Pages
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/deploy-pages@v4
